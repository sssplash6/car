    <path d="M6 30C6 16 18 7 30 8C40 9 44 18 42 28C40 38 30 43 20 42C11 41 6 37 6 30Z"/>
    <path d="M14 28C14 19 22 13 30 14C37 15 39 22 37 28C35 34 28 37 22 36C17 35 14 32 14 28Z"/>
  </g>
  <circle cx="28.5" cy="23.5" r="3.6" fill="#d97757"/>
</svg>
